name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Job-level so the signing step's `if` can see it; step-level env isn't visible to its own `if`.
      KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      # The release key lives in repository secrets; without them the release APK is debug-signed.
      - name: Restore signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          # Tolerate line breaks or spaces picked up when the secret was pasted.
          if ! printf '%s' "$KEYSTORE_BASE64" | tr -d ' \t\r\n' | base64 --decode > "$RUNNER_TEMP/release.jks"; then
            echo "::error::SIGNING_KEYSTORE_BASE64 is not valid base64. Paste the text inside SIGNING_KEYSTORE_BASE64.txt, not the .jks file."
            exit 1
          fi
          echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APKs
        env:
          SIGNING_KEYSTORE_PASSWORD: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug assembleRelease

      - name: Name the release APKs
        run: |
          cp app/build/outputs/apk/release/app-release.apk "player-$(grep -m1 versionName app/build.gradle.kts | cut -d'"' -f2).apk"
          cp phone/build/outputs/apk/release/phone-release.apk "tv-companion-phone-$(grep -m1 versionName phone/build.gradle.kts | cut -d'"' -f2).apk"

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: player-release
          path: player-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: phone-companion
          path: tv-companion-phone-*.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: player-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
